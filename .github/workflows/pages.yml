name: Deploy to GitHub Pages

# prototype/ をサイトのルート、docs/ を /docs/ として公開する。
# ビルドは無し（静的ファイルをそのまま並べ替えるだけ）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開中のデプロイは中断せず、後続を1つだけ待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 構文チェック
        run: |
          for f in prototype/*.js; do node --check "$f"; done

      - name: サイトを組み立てる
        run: |
          mkdir -p _site
          cp -R prototype/. _site/
          mkdir -p _site/docs
          cp -R docs/. _site/docs/
          # Jekyll の処理を無効化（_ で始まるファイルが消えるのを防ぐ）
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
