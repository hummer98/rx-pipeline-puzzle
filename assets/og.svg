<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Hiragino Sans, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#2dd4bf"/>

  <!-- title -->
  <text x="80" y="150" font-size="72" font-weight="800" fill="#ffffff">Reactive<tspan fill="#2dd4bf">Extream</tspan></text>
  <text x="82" y="196" font-size="24" font-weight="600" fill="#9aa6b6">An RxJS pipeline puzzle — learn Observable operators by building marble diagrams.</text>

  <!-- marble diagram -->
  <g transform="translate(80, 262)">
    <text x="0" y="0" font-size="17" font-weight="700" fill="#6b7889">INPUT</text>
    <line x1="0" y1="34" x2="1040" y2="34" stroke="#2a3441" stroke-width="2"/>
    <g fill="#1f6feb" font-size="19" font-weight="700">
      <circle cx="90" cy="34" r="21" fill="#152845" stroke="#60a5fa" stroke-width="2"/>
      <text x="90" y="41" text-anchor="middle" fill="#93c5fd">1</text>
      <circle cx="330" cy="34" r="21" fill="#152845" stroke="#60a5fa" stroke-width="2"/>
      <text x="330" y="41" text-anchor="middle" fill="#93c5fd">2</text>
      <circle cx="640" cy="34" r="21" fill="#152845" stroke="#60a5fa" stroke-width="2"/>
      <text x="640" y="41" text-anchor="middle" fill="#93c5fd">3</text>
    </g>
    <rect x="985" y="14" width="4" height="40" fill="#6b7889"/>

    <!-- operator -->
    <g transform="translate(0, 82)">
      <rect x="0" y="0" width="1040" height="58" rx="12" fill="#161d26" stroke="#2a3441" stroke-width="2"/>
      <text x="28" y="37" font-size="22" font-weight="700" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">.pipe( map(x =&gt; x * 2) )</text>
      <text x="1012" y="37" font-size="22" text-anchor="end" fill="#6b7889">↓</text>
    </g>

    <text x="0" y="182" font-size="17" font-weight="700" fill="#6b7889">OUTPUT</text>
    <line x1="0" y1="216" x2="1040" y2="216" stroke="#2a3441" stroke-width="2"/>
    <g font-size="19" font-weight="700">
      <circle cx="90" cy="216" r="21" fill="#0f2a1c" stroke="#4ade80" stroke-width="2"/>
      <text x="90" y="223" text-anchor="middle" fill="#86efac">2</text>
      <circle cx="330" cy="216" r="21" fill="#0f2a1c" stroke="#4ade80" stroke-width="2"/>
      <text x="330" y="223" text-anchor="middle" fill="#86efac">4</text>
      <circle cx="640" cy="216" r="21" fill="#0f2a1c" stroke="#4ade80" stroke-width="2"/>
      <text x="640" y="223" text-anchor="middle" fill="#86efac">6</text>
    </g>
    <rect x="985" y="196" width="4" height="40" fill="#4ade80"/>
  </g>

  <!-- footer stats -->
  <g transform="translate(80, 556)">
    <rect x="0" y="-30" width="1040" height="1" fill="#2a3441"/>
    <text x="0" y="16" font-size="23" font-weight="700" fill="#e6ebf2">94 stages · 12 cycles · 39 operators</text>
    <text x="1040" y="16" font-size="21" text-anchor="end" fill="#7f8b9b">RxJS のオペレータをパズルで学ぶ</text>
  </g>
</svg>
